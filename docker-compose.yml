services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devpilot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-devpilot}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your root .env file}
    ports:
     - "${DB_PORT:-5433}:5432"
    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data 
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devpilot_pg_data: